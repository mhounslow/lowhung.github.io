<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <script>
            try {
                var t = localStorage.getItem("theme");
                if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
            } catch (e) {}
        </script>
        <meta name="theme-color" content="#faf9f5" />
        <meta name="robots" content="noindex" />
        <title>404 — matt hounslow</title>
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
        <link rel="preload" href="/assets/fonts/quattro-400.woff2" as="font" type="font/woff2" crossorigin />
        <link rel="preload" href="/assets/fonts/quattro-700.woff2" as="font" type="font/woff2" crossorigin />
        <link rel="preload" href="/assets/fonts/mono-400.woff2" as="font" type="font/woff2" crossorigin />
        <link rel="stylesheet" href="/assets/site.css?v=5" />
        <style>
            .lost {
                min-height: 60vh;
                display: flex;
                flex-direction: column;
                justify-content: center;
                gap: 0.35rem;
                padding-top: 3rem;
                font-family: var(--font-mono);
                font-size: 0.9375rem;
            }
            .lost .prompt {
                color: var(--accent);
                margin-right: 0.5rem;
            }
            .lost .err {
                color: var(--text-3);
                margin-bottom: 1.5rem;
                word-break: break-all;
            }
            .lost h1 {
                font-family: var(--font-sans);
                font-size: clamp(3rem, 12vw, 5rem);
                line-height: 1;
                letter-spacing: -0.05em;
                margin-bottom: 1.25rem;
            }
            .lost .actions {
                display: flex;
                gap: 0.5rem;
                flex-wrap: wrap;
                margin-top: 1rem;
            }
        </style>
    </head>
    <body>
        <header class="site-header">
            <div class="wrap">
                <a href="/" class="logo"><span class="prompt">~</span>matt hounslow</a>
                <button class="theme-toggle" type="button" data-theme-toggle aria-label="toggle theme">
                    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" /></svg>
                    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" /></svg>
                </button>
            </div>
        </header>
        <main class="wrap lost">
            <h1>404<span class="cursor" aria-hidden="true"></span></h1>
            <p><span class="prompt">$</span>cd <span id="path">this-page</span></p>
            <p class="err">cd: no such file or directory</p>
            <div class="actions">
                <a class="btn primary" href="/">cd ~</a>
                <a class="btn" href="/art.html">ls ~/art</a>
            </div>
        </main>
        <script src="/assets/site.js?v=5"></script>
        <script>
            document.getElementById("path").textContent = location.pathname;
        </script>
    </body>
</html>
